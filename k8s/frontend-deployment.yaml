# ==============================================================================
# Security Log Anomaly Detection System (NIIT University Capstone II)
# Frontend React SPA Deployment & Service Manifest
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: slads-frontend
  namespace: slads
  labels:
    app: slads-frontend
    app.kubernetes.io/name: slads-frontend
    app.kubernetes.io/component: web-frontend
    app.kubernetes.io/part-of: security-log-anomaly-detection
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: slads-frontend
  template:
    metadata:
      labels:
        app: slads-frontend
    spec:
      containers:
        - name: slads-frontend
          image: niitcapstone/slads-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: slads-frontend
  namespace: slads
  labels:
    app: slads-frontend
    app.kubernetes.io/name: slads-frontend
    app.kubernetes.io/component: web-frontend
spec:
  type: ClusterIP
  selector:
    app: slads-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
