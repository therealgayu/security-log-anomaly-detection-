# ==============================================================================
# Security Log Anomaly Detection System (NIIT University Capstone II)
# Kubernetes Secret Template Manifest
# Note: In production, inject secrets via SealedSecrets, Vault, or AWS Secrets Manager.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: slads-secrets
  namespace: slads
  labels:
    app.kubernetes.io/name: slads-secrets
    app.kubernetes.io/part-of: security-log-anomaly-detection
type: Opaque
stringData:
  # MongoDB Atlas production connection string
  MONGO_URI: "mongodb+srv://<username>:<password>@cluster0.mongodb.net/security_logs_db?retryWrites=true&w=majority"
  
  # Cryptographic JWT signing secret (minimum 32 characters)
  JWT_SECRET: "slads_super_secure_jwt_secret_key_production_2026"
  
  # Machine Learning service authentication header
  ML_API_KEY: "slads_ml_secret_key_2026"
  
  # External log shipper inbound webhook secret
  INBOUND_WEBHOOK_SECRET: "slads_inbound_secret_2026"
  
  # Google Sign-In OAuth Client ID
  GOOGLE_CLIENT_ID: "your-google-oauth-client-id.apps.googleusercontent.com"
