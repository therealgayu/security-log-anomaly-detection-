# ==============================================================================
# Security Log Anomaly Detection System (NIIT University Capstone II)
# Machine Learning Microservice Deployment & Service (Internal ClusterIP Only)
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: slads-ml-service
  namespace: slads
  labels:
    app: slads-ml-service
    app.kubernetes.io/name: slads-ml-service
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: security-log-anomaly-detection
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: slads-ml-service
  template:
    metadata:
      labels:
        app: slads-ml-service
    spec:
      containers:
        - name: slads-ml-service
          image: niitcapstone/slads-ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: slads-config
            - secretRef:
                name: slads-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: slads-ml-service
  namespace: slads
  labels:
    app: slads-ml-service
    app.kubernetes.io/name: slads-ml-service
    app.kubernetes.io/component: ml-engine
spec:
  type: ClusterIP
  selector:
    app: slads-ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
