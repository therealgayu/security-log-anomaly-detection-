# ==============================================================================
# Security Log Anomaly Detection System (NIIT University Capstone II)
# Horizontal Pod Autoscaler (HPA) for Backend Service
# ==============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slads-backend-hpa
  namespace: slads
  labels:
    app.kubernetes.io/name: slads-backend-hpa
    app.kubernetes.io/component: api-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slads-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
